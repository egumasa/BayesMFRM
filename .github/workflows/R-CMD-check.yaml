name: R-CMD-check

on:
  push:
    branches: [main, master, "fix/**"]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

env:
  # pak uses setup-r's repositories and runner library for these release checks.
  RENV_CONFIG_AUTOLOADER_ENABLED: "false"

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          extra-repositories: https://stan-dev.r-universe.dev
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'

  cmdstan-parity-and-mcmc:
    runs-on: ubuntu-latest
    name: ubuntu-latest (CmdStan parity & live MCMC)
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          extra-repositories: https://stan-dev.r-universe.dev
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check

      - name: Install CmdStan
        shell: Rscript {0}
        run: cmdstanr::install_cmdstan(cores = 2)

      - name: Run fixed-point Stan density & gradient parity checks
        run: |
          Rscript --vanilla tools/check-rsm-stan.R
          Rscript --vanilla tools/check-bias-stan.R
          Rscript --vanilla tools/check-extensions-stan.R

      - name: Run full test suite with live MCMC integration
        env:
          BAYESMFRM_RUN_STAN: "true"
        run: Rscript --vanilla tools/test-local.R
